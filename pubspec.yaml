name: archive_system
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localization: ^0.3.3

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  cloud_functions: ^5.1.0

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Date / formatting
  date_format: ^2.0.9
  intl: ^0.20.2

  # PDF / Excel export
  pdf: ^3.10.7
  printing: ^5.12.0
  excel: ^4.0.2

  # File handling
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4

  # Media / UI — all compatible with Flutter 3.27+
  font_awesome_flutter: ^10.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/